name: FolderAtlas
options:
  bundleIdPrefix: sbs.statix
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "11"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  FolderAtlas:
    type: application
    platform: macOS
    sources:
      - path: FolderAtlas
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sbs.statix.FolderAtlas
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FolderAtlas/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    scheme:
      testTargets:
        - FolderAtlasTests
  FolderAtlasTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FolderAtlasTests
    dependencies:
      - target: FolderAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sbs.statix.FolderAtlasTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FolderAtlas.app/Contents/MacOS/FolderAtlas
        BUNDLE_LOADER: $(TEST_HOST)
